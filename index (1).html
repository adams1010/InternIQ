function fieldForMajor(major){
  const m=(major||"").toLowerCase();
  if(m.includes("data science")||m.includes("statistic")) return "data";
  if(m.includes("computer science")||m.includes("software")||m.includes("cyber")||m.includes("information tech")||m.includes("artificial")||m.includes("management information")) return "cs";
  if(m.includes("computer engineer")||m.includes("electrical")) return "ece";
  if(m.includes("mechanical")||m.includes("aerospace")||m.includes("industrial")||m.includes("materials")) return "mech";
  if(m.includes("civil")||m.includes("construction")||m.includes("architecture")||m.includes("urban")) return "civil";

function MatchBar({pct,color,delay=0}){
  const [w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),delay+200);return()=>clearTimeout(t);},[pct,delay]);
  return(
    <div style={{background:"#E8F5F0",borderRadius:99,height:6,overflow:"hidden"}}>
      <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:99,transition:"width 1.4s cubic-bezier(0.4,0,0.2,1)"}}/>
    </div>
  );
}

function AnimatedPct({target,color}){
  const [n,setN]=useState(0);
  useEffect(()=>{
    let start;const dur=1000;
    const tick=ts=>{if(!start)start=ts;const p=Math.min((ts-start)/dur,1);setN(Math.round(p*target));if(p<1)requestAnimationFrame(tick);};
    const t=setTimeout(()=>requestAnimationFrame(tick),300);
    return()=>clearTimeout(t);
  },[target]);
  return<span style={{fontWeight:800,fontSize:32,color,lineHeight:1,letterSpacing:"-1.5px"}}>{n}%</span>;
}

function Counter({target,suffix}){
  const [n,setN]=useState(0);const ref=useRef(null);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(!e.isIntersecting)return;
      let start;const tick=ts=>{if(!start)start=ts;const p=Math.min((ts-start)/1400,1);setN(Math.round(p*target));if(p<1)requestAnimationFrame(tick);};
      requestAnimationFrame(tick);obs.disconnect();
    });
    if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
  },[target]);
  return React.createElement('span',{ref},n+suffix);
}

// HONEST ESTIMATOR — profile + company fit + timing, leaning low
// Experience signal from graduation date — closer to graduating = more coursework/experience.
// Returns {factor 0..1, label} where label feeds the top banner.
function experienceFromGrad(gradYear){
  if(!gradYear) return {factor:0.6,label:""};
  if(/grad/i.test(gradYear)) return {factor:1.0,label:"As a graduate student, you bring the most experience — lean into that in applications."};
  const now=new Date(2026,4,21);
  const m=gradYear.match(/(May|Dec)\s+(\d{4})/i);
  if(!m) return {factor:0.6,label:""};
  const gradMonth=/may/i.test(m[1])?4:11; // May or December
  const gradDate=new Date(parseInt(m[2],10),gradMonth,1);
  const monthsToGrad=(gradDate.getFullYear()-now.getFullYear())*12+(gradDate.getMonth()-now.getMonth());
  // monthsToGrad: ~ -? (already grad) up to ~48 (freshman). Fewer months left = more senior = stronger.
  let factor,label;
  if(monthsToGrad<=2){factor=1.0;label="You're about to graduate — you have the most coursework and experience behind you, which strengthens your odds.";}
  else if(monthsToGrad<=14){factor=0.9;label="As a rising senior, you're in the strongest position experience-wise — recruiters favor near-grads for internships.";}
  else if(monthsToGrad<=26){factor=0.72;label="As a junior-level student, you've got solid coursework behind you — a competitive spot for most internships.";}
  else if(monthsToGrad<=38){factor=0.55;label="As an underclassman, you're early — that's great for getting ahead, but expect more competition from older students for the same roles.";}
  else {factor=0.42;label="As a first-year, you're applying early in your journey — focus on roles open to underclassmen, and know your odds reflect competing against more experienced students.";}
  return {factor,label};
}
function termTiming(targetTerm){
  const now=new Date(2026,4,21); // May 21, 2026
  const parts=(targetTerm||"").split(" ");
  const season=parts[0], yr=parseInt(parts[1],10);
  const startMonth={Summer:5,Fall:8,Spring:0,Winter:11}[season];
  if(startMonth===undefined||!yr) return {mult:0.85,months:12};
  const months=(yr-now.getFullYear())*12+(startMonth-now.getMonth());
  let mult;
  if(months<1)mult=0.18; else if(months<3)mult=0.35; else if(months<6)mult=0.62; else if(months<=10)mult=1.0; else mult=0.82;
  return {mult,months};
}
function timingNote(targetTerm){
  const {months}=termTiming(targetTerm);
  const t=targetTerm||"that term";
  if(months<1) return `You're applying for ${t} after the window has basically closed — most of these roles were filled months ago. The estimates below are intentionally low.`;
  if(months<3) return `Heads up: applying now for ${t} is very late. Most of these internships fill the prior fall, so your odds are lower — and that's reflected honestly below.`;
  if(months<6) return `You're a little behind the ideal window for ${t}. Some roles are still open, but the most competitive ones are likely gone.`;
  if(months<=10) return `Good timing — you're applying in the sweet spot for ${t}. These estimates reflect a realistic, on-time application.`;
  return `You're applying early for ${t}. That's smart, but many postings aren't open yet, so treat these as a forward-looking estimate.`;
}
// Detects exceptional leadership / standout achievement from the chosen extracurricular roles.
// These are the top-rung roles that genuinely impress recruiters — weighted heavily.
const EXCEPTIONAL_KEYWORDS=["president","founder","founded","captain","chair","head ","national","winner","1st place","published","funded","scaled","secretary-general","director","editor-in-chief","valedictorian","executive","ceo","100k","10k+ revenue","$10k","return offer","full-time convert","co-inventor","granted patent","lead "];
function exceptionalPicks(extPicks){
  return (extPicks||[]).filter(e=>{
    const r=(e.role||"").toLowerCase();
    return EXCEPTIONAL_KEYWORDS.some(k=>r.includes(k));
  });
}
function leadershipBonus(extPicks){
  // 0 to 1 scaling based on how many exceptional roles (diminishing after 2)
  const n=exceptionalPicks(extPicks).length;
  if(n<=0) return 0;
  if(n===1) return 0.6;
  if(n===2) return 0.85;
  return 1.0;
}
function profileScore(ans,extPicks){
  const g={"4.0":1,"3.7–3.9":0.9,"3.5–3.6":0.8,"3.0–3.4":0.65,"2.5–2.9":0.5,"Below 2.5":0.38}[ans.gpa]||0.6;
  const sk=Math.min((ans.skills||[]).length,8)/8;
  const ec=Math.min((extPicks||[]).length,5)/5;
  const exp=experienceFromGrad(ans.gradYear).factor;
  const lead=leadershipBonus(extPicks); // exceptional leadership/achievement signal
  // GPA 32%, experience 23%, skills 20%, extracurricular breadth 13%, exceptional leadership 12%
  return 0.32*g+0.23*exp+0.20*sk+0.13*ec+0.12*lead; // 0..1
}
function honestScore(company,ans,extPicks){
  const fit=Math.max(0.40,Math.min(0.95,(company.match||70)/100)); // company-specific fit (estimate)
  const prof=profileScore(ans,extPicks);
  const {mult}=termTiming(ans.targetTerm);
  let pct=Math.round(fit*(0.55+0.45*prof)*mult*100);
  pct=Math.max(3,Math.min(94,pct));
  // Honest range: fit is an estimate, so express a band, not false precision (±7, widening when timing/early adds uncertainty)
  const spread=mult<0.4?10:8;
  const low=Math.max(2,pct-spread), high=Math.min(96,pct+Math.round(spread*0.7));
  return {pct,low,high,_profile:Math.round(prof*100),_timing:Math.round(mult*100),_fit:Math.round(fit*100),_exp:Math.round(experienceFromGrad(ans.gradYear).factor*100),_lead:Math.round(leadershipBonus(extPicks)*100)};
}
function applyHonest(list,ans,extPicks){
  return list.map(c=>{const h=honestScore(c,ans,extPicks);return{...c,match:h.pct,low:h.low,high:h.high,_profile:h._profile,_timing:h._timing,_fit:h._fit,_exp:h._exp,_lead:h._lead};})
             .sort((a,b)=>b.match-a.match);
}

    catch(e){memStats[event]=(memStats[event]||0)+1;}
    // Real cross-user analytics → PostHog. Fires for every user; owner views funnels in PostHog dashboard.

    if(typeof console!=="undefined")console.log("[iq]",event,props||"");

[{"name":"Real Company","role":"Role for ${ans.major}","location":"City, ST","industry":"Sector","match":78,"reason":"why it fits","website":"www.site.com","hasLinkedin":true,"tier":"regional"}]`;

    try{

      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,messages:[{role:"user",content:prompt}]})});
      const data=await resp.json();
      const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      let obj;try{obj=JSON.parse(text.trim());}catch(e){const m=text.match(/\{[\s\S]*\}/);obj=m?JSON.parse(m[0]):null;}
      if(obj&&obj.coverLetter){setKit({loading:false,company:a.company,coverLetter:obj.coverLetter,tips:obj.tips||[],mode:"followup"});analytics.track("followup_generated",{company:a.company});return;}
      throw new Error("parse");

                <button onClick={()=>{setEditStep(null);setPage("results");}} style={{background:"#F8FFFE",border:`1.5px solid #E2E8F0`,color:"#4A5568",padding:"13px 16px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:14,fontWeight:600}}>Cancel</button>
                <button onClick={()=>{if(!canNext())return;setEditStep(null);analytics.track("answer_edited");setShowReview(true);setPage("results");window.scrollTo(0,0);}} disabled={!canNext()}
                  style={{background:canNext()?"#fff":"#F1F5F4",border:`1.5px solid ${canNext()?G:"#E2E8F0"}`,color:canNext()?GD:"#9CA3AF",padding:"13px 16px",borderRadius:var_rl,cursor:canNext()?"pointer":"not-allowed",fontFamily:"var(--font)",fontSize:14,fontWeight:700}}>
                  Save &amp; edit more
                </button>
                <button onClick={saveEdit} disabled={!canNext()}
                  style={{flex:1,background:canNext()?`linear-gradient(135deg,${G},${GD})`:"#E2E8F0",border:"none",color:canNext()?"#fff":"#9CA3AF",padding:"14px 20px",borderRadius:var_rl,cursor:canNext()?"pointer":"not-allowed",fontFamily:"var(--font)",fontSize:15,fontWeight:700,boxShadow:canNext()?`0 4px 16px ${G}40`:"none"}}>
                  Save &amp; see results →
                </button>
              </>
            ):(<>
              {step>0&&<button onClick={()=>setStep(s=>s-1)} style={{background:"#F8FFFE",border:`1.5px solid #E2E8F0`,color:"#4A5568",padding:"13px 18px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:16}}>←</button>}
              {(cur.type==="multi"||cur.type==="zip"||cur.type==="slider"||cur.type==="extracurricular")&&(
                <button onClick={advanceQuiz} disabled={!canNext()}
                  style={{flex:1,background:canNext()?`linear-gradient(135deg,${G},${GD})`:"#E2E8F0",border:"none",color:canNext()?"#fff":"#9CA3AF",padding:"14px 24px",borderRadius:var_rl,cursor:canNext()?"pointer":"not-allowed",fontFamily:"var(--font)",fontSize:15,fontWeight:700,transition:"all 0.2s",boxShadow:canNext()?`0 4px 16px ${G}40`:"none"}}>
                  {step===STEPS.length-1?"Find My Matches →":"Continue →"}
                </button>
              )}
            </>)}
          </div>
        </div>
      </div>
    );
  }

  // EMAIL GATE
  if(page==="emailgate")return(
    <div style={{background:"#fff",minHeight:"100vh"}}>
      {showProModal&&<ProModal/>}
      <Nav/>
      <div style={{maxWidth:480,margin:"0 auto",padding:"3rem 1.5rem"}}>
        <div className="fade-up" style={{background:"#fff",border:`1.5px solid ${GL}`,borderRadius:var_rxl,padding:"2.5rem 2rem",textAlign:"center",boxShadow:"0 8px 32px rgba(0,194,133,0.1)"}}>
          <div style={{fontSize:34,marginBottom:8}}>📬</div>
          <h2 style={{fontSize:"clamp(1.5rem,3.5vw,2rem)",fontWeight:800,letterSpacing:"-1px",marginBottom:10,color:"#0A1628"}}>Where should we send your matches?</h2>
          <p style={{color:"#4A5568",fontSize:15,lineHeight:1.6,marginBottom:"1.5rem"}}>We'll email your results and ping you when new internships open in your field — so you never miss the early window that actually matters.</p>
          <input type="email" value={email} autoFocus placeholder="you@email.com"
            onChange={e=>{setEmail(e.target.value);setEmailErr("");}}
            onKeyDown={e=>{if(e.key==="Enter")submitEmail();}}
            style={{width:"100%",padding:"14px 16px",borderRadius:var_rl,border:`1.5px solid ${emailErr?CR:/.+@.+\..+/.test(email)?G:"#E2E8F0"}`,background:"#F8FFFE",fontFamily:"var(--font)",fontSize:16,textAlign:"center",outline:"none",marginBottom:8}}/>
          {emailErr&&<p style={{color:CR,fontSize:13,marginBottom:8}}>{emailErr}</p>}
          <button onClick={submitEmail} style={{width:"100%",background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"15px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:16,fontWeight:700,boxShadow:`0 4px 16px ${G}40`}}>Show my honest matches →</button>
          <p style={{fontSize:11.5,color:"#9CA3AF",marginTop:14,lineHeight:1.5}}>We'll only email you about internships and InternIQ. No spam, and we never sell your info. Unsubscribe anytime.</p>
        </div>
      </div>
    </div>
  );

  // RESULTS
  if(page==="results"){
    const trackedNames=tracked.map(t=>t.company);
    // Top picks: blend realistic chance with firm quality. Score = match, with a bonus for
    // recognized national firms (the impressive ones worth a swing), so picks aren't just the
    // safest bets — they're "strong shots + a couple of standout names."
    const pickScore=c=>c.match+(c.tier==="national"?12:0);
    const topPicks=[...results]
      .filter(c=>c.match>=42) // exclude true long-shots
      .sort((a,b)=>pickScore(b)-pickScore(a))
      .slice(0,3);
    const topNames=topPicks.map(c=>c.name);
    // Main list, sorted by the user's choice
    const free=[...results].sort((a,b)=>{
      if(sortBy==="firms"){
        const ta=a.tier==="national"?1:0, tb=b.tier==="national"?1:0;
        if(tb!==ta)return tb-ta; // national firms first
        return b.match-a.match;   // then by chance within tier
      }
      return b.match-a.match;     // default: highest chance
    });

    return(
      <div style={{background:"#fff",minHeight:"100vh"}}>
        {showProModal&&<ProModal/>}
        {showConfetti&&<Confetti/>}
        {applyModal&&ApplyModal()}
        {showReview&&ReviewPanel()}
        {proNudge&&NudgeToast()}
        <Nav/>
        <div style={{maxWidth:760,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
          {loading?(
            <div style={{textAlign:"center",padding:"6rem 2rem"}}>
              <div style={{position:"relative",width:64,height:64,margin:"0 auto 2rem"}}>
                <div style={{width:64,height:64,border:`4px solid ${GL}`,borderTopColor:G,borderRadius:"50%",animation:"spin 0.9s linear infinite"}}/>
                <span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>🔍</span>
              </div>
              <div style={{background:GL,borderRadius:var_rxl,padding:"1.5rem",maxWidth:380,margin:"0 auto"}}>
                <div style={{width:`${loadPct}%`,height:4,background:G,borderRadius:99,marginBottom:"1rem",transition:"width 1.8s ease"}}/>
                <p style={{fontWeight:700,fontSize:17,marginBottom:"0.5rem",color:"#0A1628"}}>{loadMsg}</p>
                <p style={{color:"#4A5568",fontSize:14}}>Matching {ans.major} opportunities to your profile...</p>
              </div>
            </div>
          ):(
            <>
              {/* Header */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"2rem",flexWrap:"wrap",gap:12}}>
                <div>
                  <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Your Matches</p>
                  <h2 style={{fontSize:"clamp(1.8rem,4vw,2.6rem)",fontWeight:800,letterSpacing:"-1.5px",marginTop:"0.2rem",color:"#0A1628"}}>Here's where you stand.</h2>
                  <p style={{color:"#4A5568",fontSize:13,marginTop:4}}>{ans.major} · {ans.gpa} GPA · {ans.gradYear}{ans.type&&ans.type!=="Any"?` · ${ans.type}`:""}</p>
                </div>
                <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap",justifyContent:"flex-end"}}>
                  <button onClick={()=>setShowReview(true)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"10px 18px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700,whiteSpace:"nowrap",boxShadow:`0 2px 10px ${G}40`}}>✎ Edit answers</button>
                  <button onClick={calcResults} style={{background:"#F8FFFE",border:`1.5px solid ${GL}`,color:"#0A1628",padding:"10px 18px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>↻ Refresh</button>
                  <button onClick={()=>{setEditStep(null);setShowReview(false);setStep(0);setSearchQ("");setPage("quiz");window.scrollTo(0,0);}} style={{background:"#fff",border:`1.5px solid #E2E8F0`,color:"#4A5568",padding:"10px 18px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>↺ Redo quiz</button>
                </div>
              </div>

              {/* Rewarding payoff summary */}
              {results.length>0&&(()=>{
                const top=results[0]?.match||0;
                const strong=results.filter(r=>r.match>=70).length;
                const decent=results.filter(r=>r.match>=50&&r.match<70).length;
                return(
                  <div style={{background:`linear-gradient(135deg,${G},${GD})`,borderRadius:var_rxl,padding:"1.5rem 1.75rem",marginBottom:16,color:"#fff",boxShadow:`0 8px 28px ${G}45`,position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:-30,right:-20,width:140,height:140,background:"rgba(255,255,255,0.08)",borderRadius:"50%"}}/>
                    <div style={{position:"absolute",bottom:-40,left:30,width:90,height:90,background:"rgba(255,255,255,0.06)",borderRadius:"50%"}}/>
                    <p style={{fontSize:13,fontWeight:600,opacity:0.9,marginBottom:4,position:"relative"}}>We found</p>
                    <p style={{fontSize:34,fontWeight:800,letterSpacing:"-1.5px",lineHeight:1,marginBottom:10,position:"relative"}}>{results.length} internships for you</p>
                    <div style={{display:"flex",gap:18,flexWrap:"wrap",position:"relative"}}>
                      <div><span style={{fontSize:22,fontWeight:800}}>{top}%</span><span style={{fontSize:12,opacity:0.9,marginLeft:5}}>top match</span></div>
                      {strong>0&&<div><span style={{fontSize:22,fontWeight:800}}>{strong}</span><span style={{fontSize:12,opacity:0.9,marginLeft:5}}>strong {strong===1?"match":"matches"}</span></div>}
                      {decent>0&&<div><span style={{fontSize:22,fontWeight:800}}>{decent}</span><span style={{fontSize:12,opacity:0.9,marginLeft:5}}>decent {decent===1?"shot":"shots"}</span></div>}
                    </div>
                  </div>
                );
              })()}

              {/* Location note: results are now matched to the student's area via the backend */}
              <div style={{background:"#F8FAFC",border:"1px solid #E2E8F0",borderRadius:var_rl,padding:"11px 14px",marginBottom:16,display:"flex",gap:9,alignItems:"flex-start"}}>
                <span style={{fontSize:14,flexShrink:0}}>📍</span>
                <p style={{fontSize:12.5,lineHeight:1.5,color:"#4A5568"}}>These are real firms matched to your field{/^\d{5}$/.test(ans.zip)?<> near <strong>{ans.zip}</strong></>:""}{ans.type&&ans.type!=="Any"?<>, focused on <strong>{ans.type.toLowerCase()}</strong> roles</>:""}. Always confirm the exact role, location, and current openings on each company's site before applying.</p>
              </div>

              {ans.targetTerm&&(()=>{const tt=termTiming(ans.targetTerm);const late=tt.months<3;const exp=experienceFromGrad(ans.gradYear);const exc=exceptionalPicks(extPicks);return(
                <div style={{background:late?AL:GL,border:`1px solid ${late?AM+"55":GM}`,borderLeft:`4px solid ${late?AM:G}`,borderRadius:var_rl,padding:"14px 16px",marginBottom:16}}>
                  <p style={{fontSize:13.5,lineHeight:1.55,color:"#0A1628"}}>⏱ {timingNote(ans.targetTerm)}</p>
                  {exp.label&&<p style={{fontSize:13.5,lineHeight:1.55,color:"#0A1628",marginTop:8}}>🎓 {exp.label}</p>}
                  {exc.length>0&&<p style={{fontSize:13.5,lineHeight:1.55,color:"#0A1628",marginTop:8}}>⭐ Your standout leadership — <strong>{exc.map(e=>`${e.role} (${e.activity})`).join(", ")}</strong> — is exactly what recruiters look for beyond GPA, and it's boosting your odds below. Make sure it's front and center on your resume.</p>}
                  <p style={{fontSize:12,lineHeight:1.5,color:"#4A5568",marginTop:8,paddingTop:8,borderTop:`1px solid ${late?AM+"33":GM}`}}>Each score is an honest <strong>range</strong>, not a guarantee. <strong>Timing</strong>, <strong>experience</strong>, and <strong>leadership</strong> come from real recruiting patterns; <strong>company fit</strong> is an estimate. We'd rather show a low honest number than a high false one.</p>
                </div>
              );})()}

              {/* TOP PICKS — highlighted best matches worth your energy first */}
              {topPicks.length>0&&(
                <div style={{background:`linear-gradient(135deg,#fff,${GL})`,border:`1.5px solid ${G}`,borderRadius:var_rxl,padding:"1.25rem 1.4rem",marginBottom:18,boxShadow:`0 4px 20px ${G}20`}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                    <span style={{fontSize:18}}>⭐</span>
                    <h3 style={{fontWeight:800,fontSize:17,color:"#0A1628",letterSpacing:"-0.4px"}}>Top picks for you</h3>
                  </div>
                  <p style={{fontSize:12.5,color:"#4A5568",marginBottom:12,lineHeight:1.5}}>Of all your matches, these are the strongest realistic shots — where your time is best spent first.</p>
                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {topPicks.map((c,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:12,background:"#fff",border:`1px solid ${GM}`,borderRadius:var_rl,padding:"10px 14px"}}>
                        <span style={{fontSize:20,fontWeight:800,color:G,minWidth:48}}>{c.match}%</span>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <p style={{fontWeight:700,fontSize:14,color:"#0A1628",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}</p>
                            {c.tier==="national"&&<span style={{flexShrink:0,fontSize:9.5,fontWeight:800,color:"#2563EB",background:"#2563EB15",padding:"2px 7px",borderRadius:99,letterSpacing:"0.3px"}}>BIG NAME</span>}
                          </div>
                          <p style={{fontSize:12,color:"#4A5568",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.role} · {c.location}</p>
                        </div>
                        <button onClick={()=>openApply(c)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"8px 16px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:12.5,fontWeight:700,flexShrink:0}}>Apply ↗</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Sort control */}
              <div style={{marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
                  <p style={{fontSize:13,fontWeight:700,color:"#4A5568"}}>{results.length} matches</p>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:12,color:"#9CA3AF",fontWeight:600}}>Sort:</span>
                    {[["chance","Highest chance"],["firms","Best firms"]].map(([v,l])=>(
                      <button key={v} onClick={()=>setSortBy(v)} style={{background:sortBy===v?GL:"#fff",border:`1.5px solid ${sortBy===v?G:"#E2E8F0"}`,color:sortBy===v?GD:"#4A5568",padding:"6px 12px",borderRadius:99,cursor:"pointer",fontFamily:"var(--font)",fontSize:12.5,fontWeight:700}}>{l}</button>
                    ))}
                  </div>
                </div>
                {sortBy==="firms"&&<p style={{fontSize:11.5,color:"#9CA3AF",marginTop:6,textAlign:"right"}}>Most recognized / impressive firms first — lower odds, but great on a resume.</p>}
              </div>

              {/* Free cards */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14,marginBottom:16}}>
                {free.map((c,i)=>{
                  const isStr=c.match>=70,isDec=c.match>=50&&c.match<70;
                  const accent=isStr?G:isDec?AM:CR;
                  const label=isStr?"Strong Match":isDec?"Decent Shot":"Reach";
                  const isTracked=trackedNames.includes(c.name);
                  return(
                    <div key={i} className="card-hover" style={{background:"#fff",border:`1.5px solid ${GL}`,borderTop:`3px solid ${accent}`,borderRadius:var_rl,padding:"1.5rem",display:"flex",flexDirection:"column",gap:"0.75rem",boxShadow:"0 2px 12px rgba(0,194,133,0.08)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1,minWidth:0,paddingRight:12}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                            <p style={{fontWeight:700,fontSize:16,letterSpacing:"-0.3px",color:"#0A1628"}}>{c.name}</p>
                            {c.tier==="national"&&<span style={{fontSize:9.5,fontWeight:800,color:"#2563EB",background:"#2563EB15",padding:"2px 7px",borderRadius:99,letterSpacing:"0.3px"}}>BIG NAME</span>}
                          </div>
                          <p style={{color:"#4A5568",fontSize:13,marginTop:3}}>{c.role}</p>
                          <p style={{color:"#9CA3AF",fontSize:12,marginTop:2}}>{c.location} · {c.industry}</p>
                        </div>
                        <div style={{textAlign:"right",flexShrink:0}}>
                          <AnimatedPct target={c.match} color={accent}/>
                          {typeof c.low==="number"&&<p style={{fontSize:11,color:"#9CA3AF",fontWeight:600,marginTop:-2}}>range {c.low}–{c.high}%</p>}
                          <div style={{marginTop:4}}><MatchChip label={label} accent={accent}/></div>
                        </div>
                      </div>
                      <MatchBar pct={c.match} color={accent} delay={i*120}/>
                      <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:11,color:"#9CA3AF",fontWeight:600}}>
                        <span>GPA/Profile {c._profile}%</span><span>· Experience {c._exp}%</span>{c._lead>0&&<span>· Leadership {c._lead}%</span>}<span>· Timing {c._timing}%</span><span>· Fit (est.) {c._fit}%</span>
                      </div>
                      <p style={{fontSize:13,color:"#4A5568",lineHeight:1.6,fontStyle:"italic",padding:"8px 10px",background:"#F8FFFE",borderRadius:var_r}}>{c.reason}</p>
                      <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6}}>
                        <button onClick={()=>openApply(c)}
                          style={{background:`linear-gradient(135deg,${G},${GD})`,color:"#fff",padding:"11px 8px",borderRadius:var_r,fontSize:13,fontWeight:800,border:"none",cursor:"pointer",fontFamily:"var(--font)",textAlign:"center",display:"block",width:"100%",boxShadow:`0 2px 10px ${G}40`}}>Apply now ↗</button>
                        <div style={{display:"flex",gap:6}}>
                          {c.hasLinkedin!==false&&c.name?<a href={`https://www.linkedin.com/search/results/companies/?keywords=${encodeURIComponent(c.name)}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#0077B5",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔗 LinkedIn</a>
                          :<span style={{flex:1,background:"#F8FFFE",border:"1.5px solid #E2E8F0",color:"#9CA3AF",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textAlign:"center",display:"block"}}>No LinkedIn listed</span>}
                          <a href={`https://www.indeed.com/cmp/${encodeURIComponent((c.name||"").toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-"))}/jobs?q=${encodeURIComponent(c.role||"internship")}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#2164F3",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔍 Indeed Jobs</a>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {c.website?<a href={`https://${(c.website||"").replace(/^https?:\/\//,"")}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#0A1628",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🌐 Company Website</a>:<span style={{flex:1}}/>}
                          <button onClick={()=>track(c)} style={{flex:1,background:isTracked?GL:"#fff",border:`1.5px solid ${isTracked?G:"#E2E8F0"}`,color:isTracked?GD:"#4A5568",padding:"9px 8px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:12,fontWeight:700}}>
                            {isTracked?"✓ Tracked":"+ Track"}
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <p style={{fontSize:12,color:"#9CA3AF",lineHeight:1.55,textAlign:"center",maxWidth:560,margin:"20px auto 0"}}>
                These are estimates based on your profile, company fit, and application timing — not a guarantee or an offer. We'd rather show you a low honest number than a high false one.
              </p>
            </>
          )}
        </div>
      </div>
    );
  }

  // PROFILE
  if(page==="profile"){
    const inp={width:"100%",padding:"11px 13px",borderRadius:var_r,border:"1.5px solid #E2E8F0",background:"#F8FFFE",color:"#0A1628",fontFamily:"var(--font)",fontSize:14,outline:"none",marginTop:5};
    const lbl={fontSize:12,fontWeight:700,color:"#4A5568"};
    const field=(label,key,placeholder,type="text")=>(
      <div><label style={lbl}>{label}</label><input type={type} value={profile[key]||""} placeholder={placeholder} onChange={e=>setP(key,e.target.value)} style={inp}/></div>
    );
    const yesno=(label,key)=>(
      <div><label style={lbl}>{label}</label><div style={{display:"flex",gap:8,marginTop:6}}>
        {["Yes","No"].map(o=>(<button key={o} onClick={()=>setP(key,o)} style={{flex:1,background:profile[key]===o?G:"#fff",border:`1.5px solid ${profile[key]===o?G:"#E2E8F0"}`,color:profile[key]===o?"#fff":"#0A1628",padding:"10px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:14,fontWeight:profile[key]===o?700:400}}>{o}</button>))}
      </div></div>
    );
    return(
      <div style={{background:"#fff",minHeight:"100vh"}}>
        {showProModal&&<ProModal/>}
        <Nav/>
        <div style={{maxWidth:640,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
          <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Your Profile</p>
          <h2 style={{fontSize:"clamp(1.6rem,3.5vw,2.3rem)",fontWeight:800,letterSpacing:"-1px",marginTop:"0.3rem",marginBottom:"0.4rem",color:"#0A1628"}}>Fill it once. Apply faster everywhere.</h2>
          <p style={{color:"#4A5568",fontSize:14,lineHeight:1.6,marginBottom:"1.5rem"}}>Save your info and InternIQ auto-fills a copy-paste card and a tailored cover letter on every application — so you stop retyping the same fields on fifty different sites.</p>

          <div style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.5rem",marginBottom:14}}>
            <p style={{fontSize:11,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase",marginBottom:14}}>Contact</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
              {field("Full name","fullName","Adam Smith")}
              {field("Email","email","you@email.com","email")}
              {field("Phone","phone","(555) 123-4567","tel")}
              {field("LinkedIn URL","linkedin","linkedin.com/in/you")}
              {field("Portfolio / website (optional)","portfolio","yoursite.com")}
            </div>
          </div>

          <div style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.5rem",marginBottom:14}}>
            <p style={{fontSize:11,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase",marginBottom:14}}>Academics</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
              {field("School","school","Virginia Tech")}
              {field("Major","major","Computer Science")}
              {field("Expected graduation","gradDate","May 2027")}
              {field("GPA","gpa","3.6")}
            </div>
          </div>

          <div style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.5rem",marginBottom:14}}>
            <p style={{fontSize:11,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase",marginBottom:14}}>Common application answers</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:12}}>
              {yesno("Authorized to work in the U.S.?","workAuth")}
              {yesno("Willing to relocate?","relocate")}
            </div>
          </div>

          <div style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.5rem",marginBottom:14}}>
            <p style={{fontSize:11,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase",marginBottom:14}}>Make your applications stronger</p>
            <div style={{marginBottom:12}}><label style={lbl}>Top skills (comma separated)</label><input value={profile.topSkills||""} placeholder="Python, SQL, Excel" onChange={e=>setP("topSkills",e.target.value)} style={inp}/></div>
            <div><label style={lbl}>What makes you stand out? (used in cover letters)</label><textarea value={profile.whyMe||""} placeholder="A sentence or two about your standout experience, project, or drive." onChange={e=>setP("whyMe",e.target.value)} style={{...inp,minHeight:70,resize:"vertical"}}/></div>
          </div>

          {/* RESUMES — save multiple, named, pick per application */}
          <div style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.5rem",marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <p style={{fontSize:11,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase"}}>Your resumes</p>
              <button onClick={addResume} style={{background:GL,border:`1px solid ${GM}`,color:GD,padding:"6px 14px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700}}>+ Add resume</button>
            </div>
            <p style={{fontSize:12.5,color:"#4A5568",lineHeight:1.5,marginBottom:14}}>Save multiple resumes for different kinds of roles (e.g. "Software" and "Finance"). When you apply, you'll pick which one to tailor the cover letter from.</p>
            {(profile.resumes||[]).length===0&&(
              <div style={{textAlign:"center",padding:"1.25rem",border:`1.5px dashed ${GM}`,borderRadius:var_rl,color:"#9CA3AF",fontSize:13.5}}>
                No resumes yet. Tap "+ Add resume" to paste your first one.
              </div>
            )}
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {(profile.resumes||[]).map(r=>(
                <div key={r.id} style={{border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1rem",background:"#fff"}}>
                  <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}>
                    <input value={r.name} onChange={e=>updateResume(r.id,"name",e.target.value)} placeholder="Resume name" style={{flex:1,padding:"8px 11px",borderRadius:var_r,border:`1.5px solid #E2E8F0`,background:"#F8FFFE",color:"#0A1628",fontFamily:"var(--font)",fontSize:14,fontWeight:700,outline:"none"}}/>
                    <button onClick={()=>deleteResume(r.id)} aria-label="Delete resume" style={{background:"#fff",border:"1.5px solid #E2E8F0",color:CR,width:34,height:34,borderRadius:var_r,cursor:"pointer",fontSize:15,flexShrink:0}}>🗑</button>
                  </div>
                  <textarea value={r.text} onChange={e=>updateResume(r.id,"text",e.target.value)} placeholder="Paste this resume's text here…" style={{...inp,minHeight:90,resize:"vertical",marginTop:0}}/>
                </div>
              ))}
            </div>
          </div>

          <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center"}}>
            <button onClick={saveProfile} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"13px 28px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:15,fontWeight:700,boxShadow:`0 4px 16px ${G}40`}}>{profileSaved?"✓ Saved":"Save profile"}</button>
            <button onClick={clearProfile} style={{background:"#fff",border:"1.5px solid #E2E8F0",color:"#4A5568",padding:"13px 20px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:14,fontWeight:600}}>Clear my data</button>
            {profileReady()&&<span style={{fontSize:13,color:GD,fontWeight:700}}>Ready to auto-fill applications ✓</span>}
          </div>
          <p style={{fontSize:11.5,color:"#9CA3AF",marginTop:16,lineHeight:1.5}}>🔒 Your profile is saved on this device only — we don't send it anywhere in this version. You can clear it anytime. (When accounts launch, this same info will sync securely to your account.)</p>
        </div>
      </div>
    );
  }

  // COMMUNITY — honest tips & resources hub (no fake users)
  if(page==="community"){
    const shown=tipCat==="All"?TIPS:TIPS.filter(t=>t.cat===tipCat);
    return(
      <div style={{background:"#fff",minHeight:"100vh"}}>
        {showProModal&&<ProModal/>}
        <Nav/>
        <div style={{maxWidth:680,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
          <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Tips & Resources</p>
          <h2 style={{fontSize:"clamp(1.6rem,3.5vw,2.3rem)",fontWeight:800,letterSpacing:"-1px",marginTop:"0.3rem",marginBottom:"0.5rem",color:"#0A1628"}}>How to actually land the internship.</h2>
          <p style={{color:"#4A5568",fontSize:14.5,lineHeight:1.6,marginBottom:"1.5rem"}}>Honest, no-fluff advice on timing, applications, and standing out — the stuff that actually moves the needle, in one place.</p>

          {/* Category filter */}
          <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:"1.5rem"}}>
            {TIP_CATS.map(c=>(
              <button key={c} onClick={()=>setTipCat(c)} style={{background:tipCat===c?`linear-gradient(135deg,${G},${GD})`:"#F8FFFE",border:`1.5px solid ${tipCat===c?G:"#E2E8F0"}`,color:tipCat===c?"#fff":"#4A5568",padding:"7px 15px",borderRadius:99,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:tipCat===c?700:500,transition:"all 0.15s"}}>{c}</button>
            ))}
          </div>

          {/* Tips */}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {shown.map((t,i)=>(
              <div key={i} className="card-hover" style={{background:"#fff",border:`1px solid ${GL}`,borderLeft:`4px solid ${G}`,borderRadius:var_rl,padding:"1.25rem 1.4rem",boxShadow:"0 1px 8px rgba(0,194,133,0.05)"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{fontSize:20}}>{t.icon}</span>
                  <div>
                    <span style={{fontSize:10,fontWeight:700,color:GD,letterSpacing:"1px",textTransform:"uppercase"}}>{t.cat}</span>
                    <h3 style={{fontSize:16,fontWeight:800,color:"#0A1628",letterSpacing:"-0.3px",lineHeight:1.2}}>{t.title}</h3>
                  </div>
                </div>
                <p style={{fontSize:14,color:"#4A5568",lineHeight:1.65}}>{t.text}</p>
              </div>
            ))}
          </div>

          {/* Honest CTA back to the tool */}
          <div style={{background:`linear-gradient(135deg,${GL},${AL})`,border:`1px solid ${G}25`,borderRadius:var_rl,padding:"1.5rem",marginTop:18,textAlign:"center"}}>
            <p style={{fontWeight:800,fontSize:17,color:"#0A1628",marginBottom:6,letterSpacing:"-0.3px"}}>Ready to put this into action?</p>
            <p style={{fontSize:13.5,color:"#4A5568",lineHeight:1.55,marginBottom:14}}>Get your honest odds and a tailored list of internships to apply to.</p>
            <button onClick={()=>{setStep(0);setEditStep(null);setPage("quiz");window.scrollTo(0,0);}} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"12px 28px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:15,fontWeight:700,boxShadow:`0 4px 16px ${G}40`}}>Find my matches →</button>
          </div>

          <p style={{fontSize:11.5,color:"#9CA3AF",lineHeight:1.5,textAlign:"center",marginTop:16}}>More tips are added over time. Have one worth sharing? We'd love to hear it — reach out anytime.</p>
        </div>
      </div>
    );
  }

  // DASHBOARD
  if(page==="dashboard")return(
    <div style={{background:"#fff",minHeight:"100vh"}}>
      {showProModal&&<ProModal/>}
      {followUpModal&&FollowUpModal()}
      <Nav/>
      <div style={{maxWidth:720,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"2rem"}}>
          <div>
            <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Dashboard</p>
            <h2 style={{fontSize:"clamp(1.6rem,3.5vw,2.3rem)",fontWeight:800,letterSpacing:"-1px",marginTop:"0.3rem",color:"#0A1628"}}>Your applications.</h2>
          </div>
          {isPro?<span style={{background:GL,color:GD,border:`1px solid ${GM}`,padding:"6px 16px",borderRadius:99,fontSize:13,fontWeight:700}}>⚡ Pro Active</span>
          :<button onClick={()=>setShowProModal(true)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"9px 20px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:14,fontWeight:700,boxShadow:`0 2px 10px ${G}40`}}>⚡ Upgrade to Pro</button>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:"0.75rem",marginBottom:"1.5rem"}}>
          {[{l:"Applied",v:tracked.length,c:G},{l:"Interviews",v:tracked.filter(a=>a.status==="Interview").length,c:AM},{l:"Follow-ups Due",v:tracked.filter(a=>followUpStatus(a).state==="due").length,c:CR}].map((s,i)=>(
            <div key={i} style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.25rem",position:"relative",overflow:"hidden"}}>
              <p style={{fontSize:32,fontWeight:800,color:s.c,lineHeight:1,letterSpacing:"-1.5px"}}>{s.v}</p>
              <p style={{fontSize:12,color:"#4A5568",marginTop:6,fontWeight:500}}>{s.l}</p>
            </div>
          ))}
        </div>
        <div style={{background:"#fff",border:`1.5px solid ${GL}`,borderRadius:var_rl,overflow:"hidden",marginBottom:"1rem",boxShadow:"0 2px 12px rgba(0,194,133,0.06)"}}>
          <div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${GL}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontWeight:700,fontSize:15,color:"#0A1628"}}>Application Tracker</h3>
            <button onClick={()=>{setStep(0);setPage("quiz");}} style={{background:GL,border:`1px solid ${GM}`,color:GD,padding:"6px 14px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700}}>+ Add</button>
          </div>
          {tracked.length===0&&<p style={{padding:"2rem",textAlign:"center",color:"#9CA3AF",fontSize:14}}>No applications yet. Complete the quiz to find matches.</p>}
          {tracked.map((a,i)=>{
            const sc={Applied:"#4A5568",Interview:GD,Offer:"#2563EB",Rejected:CR}[a.status]||"#4A5568";
            const fu=followUpStatus(a);
            const fuColor={due:CR,soon:AM,done:GD,wait:"#9CA3AF",unknown:"#9CA3AF"}[fu.state];
            const showFollow=a.status==="Applied"&&fu.state!=="unknown";
            return(
              <div key={i} style={{padding:"1rem 1.25rem",borderBottom:i<tracked.length-1?`1px solid ${GL}`:"none"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontWeight:700,fontSize:15,color:"#0A1628",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.company}</p>
                    <p style={{color:"#4A5568",fontSize:13,marginTop:2}}>{a.role} · Applied {a.date}</p>
                  </div>
                  <select value={a.status} onChange={e=>setTracked(p=>p.map((x,j)=>j===i?{...x,status:e.target.value}:x))} style={{color:sc,fontFamily:"var(--font)",fontSize:13,fontWeight:700,padding:"6px 10px",borderRadius:var_r,border:`1.5px solid ${GL}`,background:"#F8FFFE",cursor:"pointer",flexShrink:0}}>
                    {["Applied","Interview","Offer","Rejected"].map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <button onClick={()=>setTracked(p=>p.filter((x,j)=>j!==i))} aria-label="Remove application" title="Remove" style={{background:"#fff",border:"1.5px solid #E2E8F0",color:"#9CA3AF",width:34,height:34,borderRadius:var_r,cursor:"pointer",fontSize:14,flexShrink:0,lineHeight:1}}>✕</button>
                </div>
                {showFollow&&(
                  <div style={{display:"flex",alignItems:"center",gap:10,marginTop:10,flexWrap:"wrap"}}>
                    <span style={{fontSize:12,fontWeight:700,color:fuColor,background:fuColor+"15",padding:"3px 10px",borderRadius:99}}>{fu.label}</span>
                    {fu.state==="done"
                      ? <span style={{fontSize:12,color:"#9CA3AF"}}>Nice — that keeps you on their radar.</span>
                      : <button onClick={()=>{setFollowUpModal(a);generateFollowUp(a);}} style={{background:fu.state==="due"?`linear-gradient(135deg,${G},${GD})`:"#fff",border:fu.state==="due"?"none":`1.5px solid ${G}`,color:fu.state==="due"?"#fff":GD,padding:"6px 14px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:12.5,fontWeight:700}}>✍️ Draft follow-up</button>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
        <div style={{background:`linear-gradient(135deg,${GL},${AL})`,border:`1.5px solid ${G}25`,borderRadius:var_rl,padding:"1.5rem 1.75rem"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:24}}>📧</span>
            <h3 style={{fontWeight:800,fontSize:17,letterSpacing:"-0.4px",color:"#0A1628"}}>Smart follow-ups</h3>
          </div>
          <p style={{color:"#4A5568",fontSize:14,lineHeight:1.6,marginBottom:14}}>Most students never follow up — and a good one can triple your callback odds. InternIQ tracks the timing for you and, when an application hits the 5-day mark, drafts a tailored follow-up email you send from your own inbox. You stay the sender; we handle the reminder and the words.</p>
          <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:12.5,color:GD,fontWeight:700}}>
            <span>✓ Timed automatically</span><span>✓ Drafted for each role</span><span>✓ Sent by you, as you</span>
          </div>
          {!isPro&&<p style={{fontSize:12,color:"#9CA3AF",marginTop:12,lineHeight:1.5}}>Free includes follow-up timing + drafts here. Pro adds email reminders so you never have to check back manually.</p>}
        </div>
        {/* FOUNDER ANALYTICS — instrument the funnel. Device-local only (see note). */}
        <details style={{marginTop:14,background:"#0A1628",borderRadius:var_rl,padding:"0.5rem 1rem",color:"#fff"}}>
          <summary style={{cursor:"pointer",fontSize:13,fontWeight:700,padding:"8px 0",listStyle:"none"}}>📊 Founder stats (this device only)</summary>
          <div style={{paddingBottom:12}}>
            {(()=>{const s=analytics.read();const keys=["quiz_completed","return_visit","email_captured","application_started","application_tracked","followup_generated","followup_marked_sent","cover_letter_generated","pro_modal_opened","pro_upgrade_clicked"];return(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:10}}>
                {keys.map(k=>(
                  <div key={k} style={{background:"rgba(255,255,255,0.06)",borderRadius:var_r,padding:"8px 10px"}}>
                    <p style={{fontSize:20,fontWeight:800,color:"#fff",lineHeight:1}}>{s[k]||0}</p>
                    <p style={{fontSize:10.5,color:"#9CA3AF",marginTop:3}}>{k.replace(/_/g," ")}</p>
                  </div>
                ))}
              </div>
            );})()}
            <p style={{fontSize:11,color:"#9CA3AF",lineHeight:1.5}}>These counts are from <strong>this browser only</strong> — useful for testing that events fire. For real cross-user analytics, add Plausible or PostHog at the marked line in the analytics helper (one line). Remove this panel before public launch.</p>
          </div>
        </details>
      </div>
    </div>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
