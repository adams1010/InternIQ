function MatchBar({pct,color,delay=0}){
  const [w,setW]=useState(0);
  useEffect(()=>{const t=setTimeout(()=>setW(pct),delay+200);return()=>clearTimeout(t);},[pct,delay]);
  return(
    <div style={{background:"#E8F5F0",borderRadius:99,height:6,overflow:"hidden"}}>
      <div style={{width:`${w}%`,height:"100%",background:color,borderRadius:99,transition:"width 1.4s cubic-bezier(0.4,0,0.2,1)"}}/>
    </div>
  );
}

function AnimatedPct({target,color}){
  const [n,setN]=useState(0);
  useEffect(()=>{
    let start;const dur=1000;
    const tick=ts=>{if(!start)start=ts;const p=Math.min((ts-start)/dur,1);setN(Math.round(p*target));if(p<1)requestAnimationFrame(tick);};
    const t=setTimeout(()=>requestAnimationFrame(tick),300);
    return()=>clearTimeout(t);
  },[target]);
  return<span style={{fontWeight:800,fontSize:32,color,lineHeight:1,letterSpacing:"-1.5px"}}>{n}%</span>;
}

function Counter({target,suffix}){
  const [n,setN]=useState(0);const ref=useRef(null);
  useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(!e.isIntersecting)return;
      let start;const tick=ts=>{if(!start)start=ts;const p=Math.min((ts-start)/1400,1);setN(Math.round(p*target));if(p<1)requestAnimationFrame(tick);};
      requestAnimationFrame(tick);obs.disconnect();
    });
    if(ref.current)obs.observe(ref.current);return()=>obs.disconnect();
  },[target]);
  return React.createElement('span',{ref},n+suffix);
}

function Confetti(){
  const pieces=Array.from({length:24},(_,i)=>({
    id:i,color:PALETTE[i%PALETTE.length],
    x:Math.random()*100,delay:Math.random()*1.5,
    size:6+Math.random()*8,rot:Math.random()*360
  }));
  return(
    <div style={{position:"fixed",top:0,left:0,width:"100%",height:"100%",pointerEvents:"none",zIndex:999,overflow:"hidden"}}>
      {pieces.map(p=>(
        <div key={p.id} style={{position:"absolute",left:`${p.x}%`,top:-20,width:p.size,height:p.size,background:p.color,borderRadius:p.id%3===0?"50%":2,animation:`confettiFall 2.5s ${p.delay}s ease-in forwards`,transform:`rotate(${p.rot}deg)`}}/>
      ))}
    </div>
  );
}

function App(){
  const [page,setPage]=useState("landing");
  const [step,setStep]=useState(0);
  const [ans,setAns]=useState({university:"",gradYear:"",major:"",gpa:"",extracurriculars:[],skills:[],type:"",zip:"",radius:50});
  // extracurriculars stored as [{activity, role}]
  const [extPicks,setExtPicks]=useState([]);
  const [results,setResults]=useState([]);
  const [loading,setLoading]=useState(false);
  const [loadMsg,setLoadMsg]=useState(LOAD_MSGS[0]);
  const [loadPct,setLoadPct]=useState(0);
  const [searchQ,setSearchQ]=useState("");
  const [expandedExt,setExpandedExt]=useState(null);
  const [roleModal,setRoleModal]=useState(null); // {catId, actName}
  const [posts,setPosts]=useState(POSTS);
  const [draft,setDraft]=useState("");
  const [draftTag,setDraftTag]=useState("General");
  const [isPro,setIsPro]=useState(false);
  const [showProModal,setShowProModal]=useState(false);
  const [showConfetti,setShowConfetti]=useState(false);
  const [profilePct,setProfilePct]=useState(0);
  const [tracked,setTracked]=useState([
    {company:"KMM Group, Ltd.",role:"Mechanical Engineering Intern",status:"Applied",date:"Jan 15"},
    {company:"Selas Heat Technology",role:"Engineering Intern",status:"Interview",date:"Jan 12"},
  ]);

  const cur=STEPS[step];

  // Profile strength
  useEffect(()=>{
    const fields=[ans.university,ans.gradYear,ans.major,ans.gpa,extPicks.length>0?"x":"",ans.skills.length>0?"x":"",ans.type,ans.zip];
    const filled=fields.filter(Boolean).length;
    setProfilePct(Math.round((filled/fields.length)*100));
  },[ans,extPicks]);

  function setA(k,v,auto=false){
    setAns(p=>({...p,[k]:v}));
    if(auto){setSearchQ("");setTimeout(()=>setStep(s=>Math.min(s+1,STEPS.length-1)),300);}
  }
  function toggleSkill(v){setAns(p=>{const a=p.skills;return{...p,skills:a.includes(v)?a.filter(x=>x!==v):[...a,v]};});}

  function canNext(){
    if(cur?.type==="multi")return ans.skills.length>0;
    if(cur?.type==="slider")return true;
    if(cur?.type==="zip")return /^\d{5}$/.test(ans.zip);
    if(cur?.type==="extracurricular")return extPicks.length>0;
    return !!ans[cur?.key];
  }

  function pickRole(catId,actName,role){
    setExtPicks(p=>{
      const existing=p.find(x=>x.activity===actName);
      if(existing){return p.map(x=>x.activity===actName?{...x,role}:x);}
      return[...p,{activity:actName,role,catId}];
    });
    setAns(p=>({...p,extracurriculars:[...new Set([...p.extracurriculars,actName])]}));
    setRoleModal(null);
  }

  function removeExt(actName){
    setExtPicks(p=>p.filter(x=>x.activity!==actName));
    setAns(p=>({...p,extracurriculars:p.extracurriculars.filter(x=>x!==actName)}));
  }

  async function calcResults(){
    setLoading(true);setPage("results");setShowConfetti(false);
    let mi=0,pct=0;setLoadMsg(LOAD_MSGS[0]);setLoadPct(0);
    const iv=setInterval(()=>{
      mi=(mi+1)%LOAD_MSGS.length;setLoadMsg(LOAD_MSGS[mi]);
      pct=Math.min(pct+18,90);setLoadPct(pct);
    },1800);

    const extStr=extPicks.map(e=>`${e.activity} (${e.role})`).join(", ")||"various";
        const prompt=`You are a hyper-specialized internship placement expert. Your job is to find REAL local companies hiring for the student's EXACT major.

STUDENT PROFILE:
- Major: ${ans.major} ← THIS IS THE #1 PRIORITY. Every single company and role must be relevant to this major.
- University: ${ans.university}
- GPA: ${ans.gpa}
- Graduating: ${ans.gradYear}
- Zip Code: ${ans.zip} (find companies within ${ans.radius} miles)
- Skills: ${ans.skills.join(",")||"general"}
- Activities: ${extStr}
- Internship Type: ${ans.type}

YOUR TASK: Generate exactly 12 REAL internship opportunities for a ${ans.major} student.

CRITICAL RULES — READ CAREFULLY:
1. EVERY role must be directly relevant to ${ans.major}. A Pre-Law student gets law firms, DA offices, public defenders, courts, legal nonprofits. A Nursing student gets hospitals, clinics, home health agencies. A Marketing student gets ad agencies, PR firms, brands. NEVER mix up majors.
2. ONLY 1-2 nationally known brands. The rest MUST be real but smaller/regional firms most students have never heard of.
3. Find companies actually near zip code ${ans.zip}. Think about what industries exist in that specific geographic region.
4. Include a wide variety of employer types: private firms, nonprofits, government agencies, startups, regional companies.
5. Match % should reflect realism: GPA ${ans.gpa} and ${ans.gradYear} graduation.
6. Company names must be REAL. Websites must be REAL and accurate.
7. LinkedIn company page slug must be the REAL LinkedIn URL slug for that company.

Return ONLY a valid JSON array. No other text. No markdown. No explanation:
[{"name":"REAL Company Name","role":"Role specific to ${ans.major}","location":"City, ST","industry":"Specific sector","match":82,"reason":"One sentence why this fits a ${ans.major} student specifically","website":"www.actualcompanywebsite.com","linkedin_slug":"actual-company-linkedin-slug"}]`;

    try{
      const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1800,messages:[{role:"user",content:prompt}]})});
      const data=await resp.json();
      const text=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
      let companies;
      try{companies=JSON.parse(text.trim());}catch{const m=text.match(/\[[\s\S]*\]/);companies=m?JSON.parse(m[0]):[];}
      if(companies&&companies.length>0){
        const normalized=companies.map(c=>({
          ...c,
          linkedin_slug:c.linkedin_slug||(c.linkedin||"").replace(/.*\/company\//,"").replace(/\//g,""),
          website:(c.website||"").replace(/^https?:\/\//,"").replace(/^\/+/,"")
        }));
        setResults(normalized.sort((a,b)=>b.match-a.match));
      }
      else throw new Error("empty");
    }catch(e){
      // Fallback: use major-adaptive placeholder companies so results always match the major
      const fallback=getMajorPlaceholders(ans.major).slice(0,4).map(c=>({
        ...c,
        reason:`${c.name} is a strong regional fit for ${ans.major} students near ${ans.zip}.`
      }));
      setResults(fallback);
    }
    clearInterval(iv);setLoadPct(100);
    setTimeout(()=>{setLoading(false);setShowConfetti(true);setTimeout(()=>setShowConfetti(false),3000);},400);
  }

  function track(c){
    if(!tracked.find(t=>t.company===c.name)){
      setTracked(p=>[...p,{company:c.name,role:c.role,status:"Applied",date:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}]);
    }
  }

  function addPost(){if(!draft.trim())return;setPosts(p=>[{id:Date.now(),name:"You",school:ans.university||"Your school",ini:"YO",color:G,time:"Just now",content:draft,likes:0,comments:0,tag:draftTag,liked:false},...p]);setDraft("");}

  // PRO MODAL
  const ProModal=()=>(
    <div style={{position:"fixed",inset:0,background:"rgba(10,22,40,0.6)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem",backdropFilter:"blur(4px)"}} onClick={()=>setShowProModal(false)}>
      <div style={{background:"#fff",borderRadius:var_rxl,padding:"2.5rem",maxWidth:440,width:"100%",boxShadow:"0 24px 80px rgba(0,0,0,0.2)",animation:"pop 0.3s ease"}} onClick={e=>e.stopPropagation()}>
        <div style={{background:`linear-gradient(135deg,${G}15,${AM}10)`,borderRadius:var_rl,padding:"1.25rem",marginBottom:"1.5rem",border:`1px solid ${GL}`}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <span style={{fontSize:24}}>⚡</span>
            <span style={{fontWeight:800,fontSize:22,color:"#0A1628",letterSpacing:"-0.5px"}}>InternIQ Pro</span>
            <span style={{marginLeft:"auto",background:`${AM}18`,color:AM,fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,border:`1px solid ${AM}30`}}>Early Access</span>
          </div>
          <p style={{color:"#4A5568",fontSize:14}}><strong style={{color:G,fontSize:18}}>$9</strong><span style={{color:"#9CA3AF",textDecoration:"line-through",marginLeft:6}}>$19</span> /month · Cancel anytime</p>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:14,marginBottom:"2rem"}}>
          {[
            {icon:"🔓",title:"See all 12 matches",desc:"Unlock 8 more local firms beyond your free preview"},
            {icon:"📧",title:"Auto follow-up emails",desc:"We send perfectly-timed follow-ups on your behalf"},
            {icon:"📊",title:"Full application tracker",desc:"Every app, interview, and offer in one dashboard"},
            {icon:"🔄",title:"Unlimited refreshes",desc:"Generate new company batches any time you want"},

            <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start"}}>

            </div>
          ))}
        </div>
        <button onClick={()=>{setIsPro(true);setShowProModal(false);}} style={{width:"100%",background:G,border:"none",color:"#fff",padding:"15px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:16,fontWeight:700,letterSpacing:"-0.3px"}}>
          Unlock Pro — $9/mo →
        </button>
        <p style={{textAlign:"center",fontSize:12,color:"#9CA3AF",marginTop:10}}>🔒 Secure · Cancel anytime · Instant access</p>
      </div>
    </div>
  );

    return(

                  <p style={{color:"#4A5568",fontSize:13,marginTop:4}}>{ans.major} · {ans.gpa} GPA · Near {ans.zip} · {ans.radius}mi</p>
                </div>
                <button onClick={calcResults} style={{background:"#F8FFFE",border:`1.5px solid ${GL}`,color:"#0A1628",padding:"10px 18px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>↻ Refresh</button>
              </div>

              {/* Free cards */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14,marginBottom:16}}>
                {free.map((c,i)=>{
                  const isStr=c.match>=70,isDec=c.match>=50&&c.match<70;
                  const accent=isStr?G:isDec?AM:CR;
                  const label=isStr?"Strong Match":isDec?"Decent Shot":"Reach";
                  const isTracked=trackedNames.includes(c.name);
                  return(
                    <div key={i} className="card-hover" style={{background:"#fff",border:`1.5px solid ${GL}`,borderTop:`3px solid ${accent}`,borderRadius:var_rl,padding:"1.5rem",display:"flex",flexDirection:"column",gap:"0.75rem",boxShadow:"0 2px 12px rgba(0,194,133,0.08)"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1,minWidth:0,paddingRight:12}}>
                          <p style={{fontWeight:700,fontSize:16,letterSpacing:"-0.3px",color:"#0A1628"}}>{c.name}</p>
                          <p style={{color:"#4A5568",fontSize:13,marginTop:3}}>{c.role}</p>
                          <p style={{color:"#9CA3AF",fontSize:12,marginTop:2}}>{c.location} · {c.industry}</p>
                        </div>
                        <div style={{textAlign:"right",flexShrink:0}}>
                          <AnimatedPct target={c.match} color={accent}/>
                          <div style={{marginTop:4}}><MatchChip label={label} accent={accent}/></div>
                        </div>
                      </div>
                      <MatchBar pct={c.match} color={accent} delay={i*120}/>
                      <p style={{fontSize:13,color:"#4A5568",lineHeight:1.6,fontStyle:"italic",padding:"8px 10px",background:"#F8FFFE",borderRadius:var_r}}>{c.reason}</p>
                      <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6}}>
                        <div style={{display:"flex",gap:6}}>
                          <a href={c.linkedin_slug?`https://www.linkedin.com/company/${c.linkedin_slug}/jobs/`:`https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent((c.role||"")+" intern")}&geoId=&location=${encodeURIComponent(c.location||"")}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#0077B5",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔗 LinkedIn Jobs</a>
                          <a href={`https://www.indeed.com/cmp/${encodeURIComponent((c.name||"").toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-"))}/jobs?q=${encodeURIComponent(c.role||"internship")}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#2164F3",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔍 Indeed Jobs</a>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          {c.website?<a href={`https://${(c.website||"").replace(/^https?:\/\//,"")}`} target="_blank" rel="noopener noreferrer"
                            style={{flex:1,background:"#0A1628",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🌐 Company Website</a>:<span style={{flex:1}}/>}
                          <button onClick={()=>track(c)} style={{flex:1,background:isTracked?GL:"#fff",border:`1.5px solid ${isTracked?G:"#E2E8F0"}`,color:isTracked?GD:"#4A5568",padding:"9px 8px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:12,fontWeight:700}}>
                            {isTracked?"✓ Tracked":"+ Track"}
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* PRO PAYWALL */}
              {!isPro&&(
                <div style={{marginBottom:16}}>
                  <div style={{background:`linear-gradient(135deg,${GL},${AL})`,border:`2px solid ${G}30`,borderRadius:var_rl,padding:"2rem",marginBottom:14,textAlign:"center",position:"relative",overflow:"hidden"}}>
                    <div style={{position:"absolute",top:-20,right:-20,width:120,height:120,background:`${G}08`,borderRadius:"50%"}}/>
                    <div style={{position:"absolute",bottom:-30,left:-10,width:80,height:80,background:`${AM}08`,borderRadius:"50%"}}/>
                    <p style={{fontSize:28,marginBottom:10}}>🔒</p>
                    <p style={{fontWeight:800,fontSize:19,letterSpacing:"-0.5px",marginBottom:8,color:"#0A1628"}}>
                      {allLocked.length} more matches hidden — including{" "}
                      <span style={{color:G}}>{strongLocked} Strong Match{strongLocked!==1?"es":""}</span>
                    </p>
                    <p style={{color:"#4A5568",fontSize:14,marginBottom:"1.5rem",lineHeight:1.6,maxWidth:420,margin:"0 auto 1.5rem"}}>
                      Upgrade to Pro to unlock every local firm near you, get auto follow-up emails sent on your behalf, and see your full tracker.
                    </p>
                    <button onClick={()=>setShowProModal(true)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"14px 32px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:15,fontWeight:700,boxShadow:`0 4px 20px ${G}40`}}>
                      ⚡ Unlock All {4+allLocked.length} Matches — $9/mo
                    </button>
                    {tracked.length>0&&<p style={{fontSize:12,color:"#9CA3AF",marginTop:10}}>You have {tracked.length} app{tracked.length!==1?"s":""} tracked — Pro auto-sends follow-ups for each one.</p>}
                  </div>
                  {/* Blurred locked cards — always 12 shown */}
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14}}>
                    {allLocked.map((c,i)=><BlurCard key={i} company={c}/>)}
                  </div>
                </div>
              )}

              {/* Pro unlocked all */}
              {isPro&&aiLocked.length>0&&(
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14,marginBottom:16}}>
                  {aiLocked.map((c,i)=>{
                    const isStr=c.match>=70,isDec=c.match>=50&&c.match<70;
                    const accent=isStr?G:isDec?AM:CR;
                    const label=isStr?"Strong Match":isDec?"Decent Shot":"Reach";
                    const isTracked=trackedNames.includes(c.name);
                    return(
                      <div key={i} className="card-hover" style={{background:"#fff",border:`1.5px solid ${GL}`,borderTop:`3px solid ${accent}`,borderRadius:var_rl,padding:"1.5rem",display:"flex",flexDirection:"column",gap:"0.75rem",boxShadow:"0 2px 12px rgba(0,194,133,0.08)"}}>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                          <div style={{flex:1,minWidth:0,paddingRight:12}}>
                            <p style={{fontWeight:700,fontSize:16,color:"#0A1628"}}>{c.name}</p>
                            <p style={{color:"#4A5568",fontSize:13,marginTop:3}}>{c.role}</p>
                            <p style={{color:"#9CA3AF",fontSize:12,marginTop:2}}>{c.location} · {c.industry}</p>
                          </div>
                          <div style={{textAlign:"right",flexShrink:0}}>
                            <AnimatedPct target={c.match} color={accent}/>
                            <div style={{marginTop:4}}><MatchChip label={label} accent={accent}/></div>
                          </div>
                        </div>
                        <MatchBar pct={c.match} color={accent} delay={i*80}/>
                        <p style={{fontSize:13,color:"#4A5568",lineHeight:1.6,fontStyle:"italic",padding:"8px 10px",background:"#F8FFFE",borderRadius:var_r}}>{c.reason}</p>
                        <div style={{display:"flex",gap:7,marginTop:4}}>
                          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:2}}>
                            <div style={{display:"flex",gap:6}}>
                              <a href={c.linkedin_slug?`https://www.linkedin.com/company/${c.linkedin_slug}/jobs/`:`https://www.linkedin.com/jobs/search/?keywords=${encodeURIComponent((c.role||"")+" intern")}&location=${encodeURIComponent(c.location||"")}`} target="_blank" rel="noopener noreferrer"
                                style={{flex:1,background:"#0077B5",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔗 LinkedIn Jobs</a>
                              <a href={`https://www.indeed.com/cmp/${encodeURIComponent((c.name||"").toLowerCase().replace(/[^a-z0-9]/g,"-").replace(/-+/g,"-"))}/jobs?q=${encodeURIComponent(c.role||"internship")}`} target="_blank" rel="noopener noreferrer"
                                style={{flex:1,background:"#2164F3",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🔍 Indeed Jobs</a>
                            </div>
                            <div style={{display:"flex",gap:6}}>
                              {c.website?<a href={`https://${(c.website||"").replace(/^https?:\/\//,"")}`} target="_blank" rel="noopener noreferrer"
                                style={{flex:1,background:"#0A1628",color:"#fff",padding:"9px 8px",borderRadius:var_r,fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>🌐 Company Website</a>:<span style={{flex:1}}/>}
                              <button onClick={()=>track(c)} style={{flex:1,background:isTracked?GL:"#fff",border:`1.5px solid ${isTracked?G:"#E2E8F0"}`,color:isTracked?GD:"#4A5568",padding:"9px 8px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:12,fontWeight:700}}>
                                {isTracked?"✓ Tracked":"+ Track"}
                              </button>
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    );
  }

  // COMMUNITY
  if(page==="community")return(
    <div style={{background:"#fff",minHeight:"100vh"}}>
      {showProModal&&<ProModal/>}
      <Nav/>
      <div style={{maxWidth:600,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
        <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Community</p>
        <h2 style={{fontSize:"clamp(1.6rem,3.5vw,2.3rem)",fontWeight:800,letterSpacing:"-1px",marginTop:"0.3rem",marginBottom:"0.5rem",color:"#0A1628"}}>Real talk from real students.</h2>
        <p style={{color:"#4A5568",fontSize:14,marginBottom:"1.5rem"}}>Tips, experiences, and honest advice. No fluff.</p>
        <div style={{background:"#fff",border:`1.5px solid ${GL}`,borderRadius:var_rl,padding:"1rem",marginBottom:"1.25rem",boxShadow:"0 2px 12px rgba(0,194,133,0.06)"}}>
          <textarea value={draft} onChange={e=>setDraft(e.target.value)} placeholder="Share a tip, experience, or question..." style={{width:"100%",background:"transparent",border:"none",outline:"none",color:"#0A1628",fontFamily:"var(--font)",fontSize:15,resize:"none",minHeight:80,lineHeight:1.6}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"0.5rem",borderTop:`1px solid ${GL}`,paddingTop:"0.75rem"}}>
            <div style={{display:"flex",gap:6}}>
              {["General","Tech","Finance","Consulting"].map(t=>(
                <button key={t} onClick={()=>setDraftTag(t)} style={{background:draftTag===t?GL:"#F8FFFE",border:`1px solid ${draftTag===t?G:"#E2E8F0"}`,color:draftTag===t?GD:"#4A5568",padding:"4px 12px",borderRadius:99,cursor:"pointer",fontFamily:"var(--font)",fontSize:12,fontWeight:draftTag===t?700:400}}>{t}</button>
              ))}
            </div>
            <button onClick={addPost} style={{background:draft.trim()?`linear-gradient(135deg,${G},${GD})`:"#E2E8F0",border:"none",color:draft.trim()?"#fff":"#9CA3AF",padding:"7px 20px",borderRadius:var_r,cursor:draft.trim()?"pointer":"not-allowed",fontFamily:"var(--font)",fontSize:14,fontWeight:700}}>Post</button>
          </div>
        </div>
        {posts.map(p=>(
          <div key={p.id} style={{background:"#fff",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.25rem",marginBottom:10,boxShadow:"0 1px 6px rgba(0,194,133,0.05)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"0.75rem"}}>
              <div style={{display:"flex",gap:10,alignItems:"center"}}>
                <Av ini={p.ini} color={p.color}/>
                <div><p style={{fontWeight:700,fontSize:14,color:"#0A1628"}}>{p.name}</p><p style={{color:"#9CA3AF",fontSize:12}}>{p.school} · {p.time}</p></div>
              </div>
              <span style={{background:`${G}15`,color:GD,fontSize:10,fontWeight:700,padding:"3px 10px",borderRadius:99,border:`1px solid ${G}25`}}>{p.tag}</span>
            </div>
            <p style={{fontSize:14,color:"#4A5568",lineHeight:1.65}}>{p.content}</p>
            <div style={{display:"flex",gap:16,marginTop:"1rem"}}>
              <button onClick={()=>setPosts(prev=>prev.map(x=>x.id===p.id?{...x,liked:!x.liked,likes:x.liked?x.likes-1:x.likes+1}:x))} style={{background:"none",border:"none",color:p.liked?CR:"#9CA3AF",cursor:"pointer",fontFamily:"var(--font)",fontSize:13,display:"flex",alignItems:"center",gap:4,fontWeight:p.liked?700:400}}>
                {p.liked?"❤️":"🤍"} {p.likes}
              </button>
              <span style={{fontSize:13,color:"#9CA3AF",display:"flex",alignItems:"center",gap:4}}>💬 {p.comments}</span>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // DASHBOARD
  if(page==="dashboard")return(
    <div style={{background:"#fff",minHeight:"100vh"}}>
      {showProModal&&<ProModal/>}
      <Nav/>
      <div style={{maxWidth:720,margin:"0 auto",padding:"2.5rem 1.5rem"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"2rem"}}>
          <div>
            <p style={{fontSize:10,color:"#9CA3AF",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>Dashboard</p>
            <h2 style={{fontSize:"clamp(1.6rem,3.5vw,2.3rem)",fontWeight:800,letterSpacing:"-1px",marginTop:"0.3rem",color:"#0A1628"}}>Your applications.</h2>
          </div>
          {isPro?<span style={{background:GL,color:GD,border:`1px solid ${GM}`,padding:"6px 16px",borderRadius:99,fontSize:13,fontWeight:700}}>⚡ Pro Active</span>
          :<button onClick={()=>setShowProModal(true)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"9px 20px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:14,fontWeight:700,boxShadow:`0 2px 10px ${G}40`}}>⚡ Upgrade to Pro</button>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,minmax(0,1fr))",gap:"0.75rem",marginBottom:"1.5rem"}}>
          {[{l:"Applied",v:tracked.length,c:G},{l:"Interviews",v:tracked.filter(a=>a.status==="Interview").length,c:AM},{l:"Follow-ups Sent",v:isPro?tracked.length:"—",c:isPro?GD:"#9CA3AF"}].map((s,i)=>(
            <div key={i} style={{background:"#F8FFFE",border:`1px solid ${GL}`,borderRadius:var_rl,padding:"1.25rem",position:"relative",overflow:"hidden"}}>
              {i===2&&!isPro&&<div style={{position:"absolute",inset:0,background:"rgba(248,255,254,0.85)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20}}>🔒</div>}
              <p style={{fontSize:32,fontWeight:800,color:s.c,lineHeight:1,letterSpacing:"-1.5px"}}>{s.v}</p>
              <p style={{fontSize:12,color:"#4A5568",marginTop:6,fontWeight:500}}>{s.l}</p>
            </div>
          ))}
        </div>
        <div style={{background:"#fff",border:`1.5px solid ${GL}`,borderRadius:var_rl,overflow:"hidden",marginBottom:"1rem",boxShadow:"0 2px 12px rgba(0,194,133,0.06)"}}>
          <div style={{padding:"1rem 1.25rem",borderBottom:`1px solid ${GL}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontWeight:700,fontSize:15,color:"#0A1628"}}>Application Tracker</h3>
            <button onClick={()=>{setStep(0);setPage("quiz");}} style={{background:GL,border:`1px solid ${GM}`,color:GD,padding:"6px 14px",borderRadius:var_r,cursor:"pointer",fontFamily:"var(--font)",fontSize:13,fontWeight:700}}>+ Add</button>
          </div>
          {tracked.length===0&&<p style={{padding:"2rem",textAlign:"center",color:"#9CA3AF",fontSize:14}}>No applications yet. Complete the quiz to find matches.</p>}
          {tracked.map((a,i)=>{
            const sc={Applied:"#4A5568",Interview:GD,Offer:"#2563EB",Rejected:CR}[a.status]||"#4A5568";
            return(
              <div key={i} style={{padding:"1rem 1.25rem",borderBottom:i<tracked.length-1?`1px solid ${GL}`:"none",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontWeight:700,fontSize:15,color:"#0A1628",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.company}</p>
                  <p style={{color:"#4A5568",fontSize:13,marginTop:2}}>{a.role} · Applied {a.date}</p>
                </div>
                <select value={a.status} onChange={e=>setTracked(p=>p.map((x,j)=>j===i?{...x,status:e.target.value}:x))} style={{color:sc,fontFamily:"var(--font)",fontSize:13,fontWeight:700,padding:"6px 10px",borderRadius:var_r,border:`1.5px solid ${GL}`,background:"#F8FFFE",cursor:"pointer",flexShrink:0}}>
                  {["Applied","Interview","Offer","Rejected"].map(s=><option key={s} value={s}>{s}</option>)}
                </select>
              </div>
            );
          })}
        </div>
        {!isPro?(
          <div style={{background:`linear-gradient(135deg,${GL},${AL})`,border:`2px solid ${G}25`,borderRadius:var_rl,padding:"2rem",textAlign:"center"}}>
            <p style={{fontSize:28,marginBottom:10}}>📧</p>
            <h3 style={{fontWeight:800,fontSize:18,marginBottom:"0.5rem",letterSpacing:"-0.5px",color:"#0A1628"}}>Auto Follow-Ups</h3>
            <p style={{color:"#4A5568",fontSize:14,lineHeight:1.6,marginBottom:"1.5rem",maxWidth:380,margin:"0 auto 1.5rem"}}>Pro members get follow-up emails sent at the perfect time. You stay top of mind — without lifting a finger.</p>
            <button onClick={()=>setShowProModal(true)} style={{background:`linear-gradient(135deg,${G},${GD})`,border:"none",color:"#fff",padding:"13px 32px",borderRadius:var_rl,cursor:"pointer",fontFamily:"var(--font)",fontSize:15,fontWeight:700,boxShadow:`0 4px 16px ${G}40`}}>⚡ Unlock Pro — $9/mo</button>
          </div>
        ):(
          <div style={{background:GL,border:`1px solid ${GM}`,borderRadius:var_rl,padding:"1.25rem"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:26}}>✅</span>
              <div>
                <p style={{fontWeight:700,fontSize:15,color:GD}}>Auto follow-ups active</p>
                <p style={{fontSize:13,color:GD,opacity:0.8,marginTop:2}}>Sending follow-ups for your {tracked.length} tracked application{tracked.length!==1?"s":""}.</p>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
